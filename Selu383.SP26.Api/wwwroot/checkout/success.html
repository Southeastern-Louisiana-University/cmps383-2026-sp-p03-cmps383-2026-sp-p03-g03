<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment Complete</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f4fbf2; color: #1f2937; }
    .wrap { max-width: 560px; margin: 48px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #d8e8d2; border-radius: 14px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.06); }
    h1 { margin: 0 0 10px; color: #14532d; font-size: 28px; }
    p { margin: 8px 0; line-height: 1.45; }
    .meta { color: #475569; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

<body>
  <div class="wrap">
    <div class="card">
      <h1>Payment Complete</h1>
      <p>Your checkout finished successfully. You can return to the app now.</p>
      <p id="session" class="meta"></p>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get("session_id");
    if (sessionId) 
    {document.getElementById("session").textContent = `Session: ${sessionId}`;}
    
  </script>
