<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Checkout Canceled</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #fff7f7; color: #1f2937; }
    .wrap { max-width: 560px; margin: 48px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #f1d6d6; border-radius: 14px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.06); }
    .logo { display: block; width: 140px; height: auto; margin: 0 auto 14px; }
    h1 { margin: 0 0 10px; color: #7f1d1d; font-size: 28px; }
    p { margin: 8px 0; line-height: 1.45; }
    .actions { margin-top: 16px; }
    .btn { display: inline-block; text-decoration: none; border-radius: 10px; padding: 10px 14px; border: 1px solid #7f1d1d; background: #7f1d1d; color: #fff; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img class="logo" src="/checkout/logo.png" alt="SELU 383" />
      <h1>Checkout Canceled</h1>
      <p>No payment was captured. You can return to the app and try again.</p>
      <div class="actions">
        <a class="btn" href="selu383sp26mobile://">Return to App</a>
      </div>
    </div>
  </div>
  <script>
    if (window.location.search) {
      const cleanUrl = ${window.location.origin}${window.location.pathname};
      window.history.replaceState({}, document.title, cleanUrl);
    }
  </script>
</body>
</html>
