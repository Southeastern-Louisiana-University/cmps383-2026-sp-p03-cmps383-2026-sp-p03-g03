<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout Canceled</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #fff7f7; color: #1f2937; }
    .wrap { max-width: 560px; margin: 48px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #f1d6d6; border-radius: 14px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.06); }
    h1 { margin: 0 0 10px; color: #7f1d1d; font-size: 28px; }
    p { margin: 8px 0; line-height: 1.45; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Checkout Canceled</h1>
      <p>No payment was captured. You can return to the app and try again.</p>
    </div>
  </div>
</body>
</html>
