on:
  push:
    branches:
      - main
    paths:
      - "Selu383.SP26.Mobile/**" # Only builds if mobile code changes
      - ".github/workflows/expo.yml" # ...Or if you update this file
  workflow_dispatch: {} # Adds a "Run workflow" button to the GitHub Actions UI

# Prevents multiple builds from running at the same time on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: 🛠️ Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: ✨ Ccache Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: Selu383.SP26.Mobile/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci --prefix ./Selu383.SP26.Mobile # clean install

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          project: Selu383.SP26.Mobile
          packager: npm

      - name: 🚀 Build app
        run: |
          cd ./Selu383.SP26.Mobile/
          eas build -p android --non-interactive --local
        env:
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ runner.temp }}
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Dorg.gradle.parallel=true -Dorg.gradle.daemon=false"
          USE_CCACHE: 1

      - name: 📦 Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ runner.temp }}/*.apk
          retention-days: 7

      - name: 🛳️ Make Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: "latest"
          prerelease: false
          files: |
            ${{ runner.temp }}/*.apk
