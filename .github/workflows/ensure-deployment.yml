name: Deployment Works

on: [deployment_status]

jobs:
  e2e:
    if: github.event.deployment_status.state == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Warm up URL
        id: warmup
        continue-on-error: true
        run: |
          URL="${{ github.event.deployment_status.environment_url }}/api/locations"
          alive="false"
          for i in {1..20}; do
            code=$(curl --connect-timeout 5 --max-time 15 -s -o /dev/null -w "%{http_code}" "$URL" || true)
            if [ "$code" = "200" ] || [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "Warmup reached app with HTTP $code"
              alive="true"
              break
            fi
            echo "Warmup attempt $i: HTTP $code"
            sleep 10
          done
          if [ "$alive" != "true" ]; then
            echo "::warning::Warmup never reached a healthy app response. Last probe stayed in 5xx/timeout."
          fi
          echo "alive=$alive" >> "$GITHUB_OUTPUT"
      - name: Test locations API
        if: steps.warmup.outputs.alive == 'true'
        continue-on-error: true
        run: |
          URL="${{ github.event.deployment_status.environment_url }}/api/locations"
          code=$(curl --connect-timeout 5 --max-time 15 -s -o /dev/null -w "%{http_code}" "$URL" || true)
          echo "locations status: $code"
          if [ "$code" != "200" ] && [ "$code" != "401" ] && [ "$code" != "403" ]; then
            echo "::warning::Unexpected locations status code: $code"
          fi
      - name: Test React
        continue-on-error: true
        run: |
          URL="${{ github.event.deployment_status.environment_url }}/index.html"
          code=$(curl --connect-timeout 5 --max-time 15 -s -o /dev/null -w "%{http_code}" "$URL" || true)
          echo "web status: $code"
          if [ "$code" -ge "500" ]; then
            echo "::warning::Web endpoint returned server error status: $code"
          fi
